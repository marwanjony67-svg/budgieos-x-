name: Build BudgieOS X ISO

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-iso:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm binutils grub-pc-bin grub-common xorriso mtools
      - name: Build ISO
        run: bash scripts/build.sh
      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: BudgieOS-X-1.0-ISO
          path: build/BudgieOS-X-1.0.iso
